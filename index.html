<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicode Math Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0f11; --surface: #18181c; --surface2: #222228;
    --border: #2e2e38; --border2: #3e3e4e;
    --text: #e8e8f0; --text2: #9898b0; --text3: #5a5a72;
    --accent: #7c6cfa; --accent-dim: #2e2860; --accent-glow: rgba(124,108,250,0.15);
    --green: #4ecb8a; --green-dim: #1a3d2b;
    --warn: #f0a04b; --warn-dim: #3a2510;
    --mono: 'JetBrains Mono', monospace; --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

  header { width: 100%; max-width: 900px; padding: 2.5rem 1.5rem 1rem; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-family: var(--mono); font-size: 1.05rem; font-weight: 400; color: var(--text2); letter-spacing: 0.05em; }
  header .badge { font-family: var(--mono); font-size: 0.7rem; color: var(--accent); background: var(--accent-dim); border: 1px solid var(--accent); padding: 2px 8px; border-radius: 3px; letter-spacing: 0.08em; }

  main { width: 100%; max-width: 900px; padding: 0 1.5rem 3rem; flex: 1; }

  .editor-wrap { position: relative; margin-bottom: 12px; }
  #editor {
    width: 100%; min-height: 120px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 1.35rem; line-height: 1.7; padding: 16px 18px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border2); border-radius: 8px;
    resize: vertical; outline: none; transition: border-color 0.15s; caret-color: var(--accent);
  }
  #editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #editor::placeholder { color: var(--text3); font-size: 1rem; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .btn { font-family: var(--sans); font-size: 0.78rem; font-weight: 500; padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border2); background: transparent; color: var(--text2); cursor: pointer; letter-spacing: 0.02em; transition: all 0.1s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--surface2); color: var(--text); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dim); }
  .btn.success { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  .search-wrap { flex: 1; min-width: 160px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
  #sym-search { width: 100%; font-family: var(--sans); font-size: 0.82rem; padding: 6px 10px 6px 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text); outline: none; transition: border-color 0.15s; }
  #sym-search:focus { border-color: var(--accent); }
  #sym-search::placeholder { color: var(--text3); }

  .shortcuts { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border-radius: 6px; border: 1px solid var(--border); }
  .shortcut { font-size: 0.7rem; color: var(--text3); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  kbd { font-family: var(--mono); font-size: 0.65rem; padding: 1px 5px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 3px; color: var(--text2); }

  .tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab { font-family: var(--sans); font-size: 0.75rem; padding: 6px 11px 7px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text3); cursor: pointer; white-space: nowrap; transition: all 0.1s; margin-bottom: -1px; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .sym-grid { display: flex; flex-wrap: wrap; gap: 4px; min-height: 80px; max-height: 210px; overflow-y: auto; padding: 4px 0; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

  .sym { min-width: 36px; height: 36px; padding: 0 6px; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; color: var(--text); transition: all 0.08s; font-family: 'JetBrains Mono', 'Courier New', monospace; position: relative; white-space: nowrap; }
  .sym:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .sym:active { transform: scale(0.93); }
  .sym.snippet { font-size: 0.7rem; font-family: var(--sans); }
  .sym.warn-sym { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }
  .sym.warn-sym:hover { background: var(--warn-dim); border-color: var(--warn); opacity: 0.8; }

  .sym::after { content: attr(data-name); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); font-family: var(--sans); font-size: 0.67rem; padding: 3px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.12s; z-index: 10; }
  .sym:hover::after { opacity: 1; }

  .note { font-size: 0.71rem; color: var(--warn); margin-top: 8px; padding: 6px 10px; background: var(--warn-dim); border-radius: 4px; display: none; line-height: 1.5; }
  .note.visible { display: block; }

  .builder { display: none; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .builder.visible { display: flex; }
  .builder input { font-family: var(--mono); font-size: 0.9rem; padding: 5px 10px; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; color: var(--text); outline: none; width: 120px; }
  .builder input:focus { border-color: var(--accent); }
  .builder label { font-size: 0.75rem; color: var(--text2); }
  .builder select { font-family: var(--mono); font-size: 0.9rem; padding: 5px 8px; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; color: var(--text); outline: none; }
  .builder-preview { font-family: 'JetBrains Mono','Courier New',monospace; font-size: 1rem; color: var(--text); min-width: 80px; padding: 6px 10px; background: var(--surface2); border-radius: 4px; white-space: pre; line-height: 1.4; }

  .status { margin-top: 12px; font-family: var(--mono); font-size: 0.72rem; color: var(--text3); }

  footer { width: 100%; max-width: 900px; padding: 1rem 1.5rem 2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text3); }
  footer a { color: var(--text3); text-decoration: none; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>unicode-math-editor</h1>
  <span class="badge">v2.1</span>
</header>

<main>
  <div class="editor-wrap">
    <textarea id="editor" placeholder="Type your math here, or click symbols below…" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="copy-btn" onclick="copyText()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
    <button class="btn" onclick="clearText()">Clear</button>
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="sym-search" type="text" placeholder="Search symbols…" oninput="filterSyms()" autocomplete="off">
    </div>
  </div>

  <div class="shortcuts">
    <div class="shortcut">select + <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>↑</kbd> superscript (toggle)</div>
    <div class="shortcut">select + <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>↓</kbd> subscript (toggle)</div>
    <div class="shortcut"><kbd>Ctrl</kbd><kbd>B</kbd> bold (toggle)</div>
    <div class="shortcut"><kbd>Ctrl</kbd><kbd>I</kbd> italic (toggle)</div>
    <div class="shortcut"><kbd>Ctrl</kbd><kbd>Z</kbd> undo</div>
    <div class="shortcut" style="color:var(--text3);font-style:italic">Shift optional on some systems</div>
  </div>

  <div class="tab-bar" id="tab-bar"></div>
  <div class="sym-grid" id="sym-grid"></div>
  <div class="note" id="warn-note"></div>

  <div class="builder" id="frac-builder">
    <label>numerator</label>
    <input id="frac-num" type="text" placeholder="a+b" oninput="updateFracPreview()">
    <label>denominator</label>
    <input id="frac-den" type="text" placeholder="c+d" oninput="updateFracPreview()">
    <div class="builder-preview" id="frac-preview"></div>
    <button class="btn primary" onclick="insertFrac()">Insert</button>
    <button class="btn" id="frac-toggle" onclick="toggleFracStyle()">Switch to multiline</button>
    <span id="frac-mode-label" style="font-size:0.68rem;color:var(--text3)"></span>
  </div>

  <div class="builder" id="matrix-builder">
    <label>rows</label>
    <input id="mat-rows" type="number" value="2" min="1" max="8" style="width:60px" oninput="updateMatrixPreview()">
    <label>cols</label>
    <input id="mat-cols" type="number" value="2" min="1" max="8" style="width:60px" oninput="updateMatrixPreview()">
    <label>bracket</label>
    <select id="mat-bracket" onchange="updateMatrixPreview()">
      <option value="square">[ ]</option>
      <option value="round">( )</option>
      <option value="curly">{ }</option>
      <option value="none">none</option>
    </select>
    <button class="btn primary" onclick="insertMatrix()">Insert scaffold</button>
  </div>

  <div class="status"><span id="char-count">0 chars</span></div>
</main>

<footer>
  <span>All characters are real Unicode codepoints — paste anywhere.</span>
  <a href="https://github.com/" target="_blank">GitHub ↗</a>
</footer>

<script>
// ── Maps ─────────────────────────────────────────────────────────────────────
const SUP_MAP={
  '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',
  '+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾',
  'a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','f':'ᶠ','g':'ᵍ','h':'ʰ','i':'ⁱ','j':'ʲ',
  'k':'ᵏ','l':'ˡ','m':'ᵐ','n':'ⁿ','o':'ᵒ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ',
  'v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ',
  'β':'ᵝ','γ':'ᵞ','δ':'ᵟ','θ':'ᶿ','ι':'ᶥ','φ':'ᵠ','χ':'ᵡ'
};
const SUB_MAP={
  '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉',
  '+':'₊','-':'₋','=':'₌','(':'₍',')':'₎',
  'a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ',
  'p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ',
  'β':'ᵦ','γ':'ᵧ','ρ':'ᵨ','φ':'ᵩ','χ':'ᵪ'
};
const SUP_REV=Object.fromEntries(Object.entries(SUP_MAP).map(([k,v])=>[v,k]));
const SUB_REV=Object.fromEntries(Object.entries(SUB_MAP).map(([k,v])=>[v,k]));

const BOLD_MAP={}, BOLD_REV={}, ITALIC_MAP={}, ITALIC_REV={};
(function(){
  const bA=0x1D400, ba=0x1D41A, b0=0x1D7CE;
  const iA=0x1D434, ia=0x1D44E;
  for(let i=0;i<26;i++){
    const lc=String.fromCharCode(97+i), uc=String.fromCharCode(65+i);
    const blc=String.fromCodePoint(ba+i), buc=String.fromCodePoint(bA+i);
    const ilc=(lc==='h')?'\u210E':String.fromCodePoint(ia+i);
    const iuc=String.fromCodePoint(iA+i);
    BOLD_MAP[lc]=blc; BOLD_MAP[uc]=buc; BOLD_REV[blc]=lc; BOLD_REV[buc]=uc;
    ITALIC_MAP[lc]=ilc; ITALIC_MAP[uc]=iuc; ITALIC_REV[ilc]=lc; ITALIC_REV[iuc]=uc;
  }
  for(let i=0;i<10;i++){
    const d=String(i), bd=String.fromCodePoint(b0+i);
    BOLD_MAP[d]=bd; BOLD_REV[bd]=d;
  }
})();

// ── Categories ────────────────────────────────────────────────────────────────
const CATS=[
  {id:'sup', label:'Superscripts', syms:[
    ...Object.entries(SUP_MAP).map(([k,v])=>({s:v, n:'sup: '+k}))
  ]},
  {id:'sub', label:'Subscripts', syms:[
    ...Object.entries(SUB_MAP).map(([k,v])=>({s:v, n:'sub: '+k}))
  ]},
  {id:'ops', label:'Operators', syms:[
    {s:'±',n:'plus-minus'},{s:'∓',n:'minus-plus'},{s:'×',n:'times'},{s:'÷',n:'divide'},
    {s:'·',n:'dot product'},{s:'∗',n:'asterisk'},{s:'⊕',n:'oplus direct sum'},
    {s:'⊗',n:'otimes tensor'},{s:'⊙',n:'odot solar mass'},{s:'∘',n:'ring compose'},
    {s:'√',n:'sqrt'},{s:'∛',n:'cube root'},{s:'∜',n:'fourth root'},
    {s:'∝',n:'proportional to'},{s:'∞',n:'infinity'},{s:'∂',n:'partial derivative'},
    {s:'∇',n:'nabla del'},{s:'Δ',n:'delta laplacian'},{s:'∫',n:'integral'},
    {s:'∬',n:'double integral'},{s:'∭',n:'triple integral'},{s:'∮',n:'contour integral'},
    {s:'∑',n:'sum sigma'},{s:'∏',n:'product pi'},{s:'∐',n:'coproduct'},
    {s:'†',n:'dagger hermitian conjugate'},{s:'‡',n:'double dagger'},
  ]},
  {id:'rel', label:'Relations', syms:[
    {s:'≠',n:'not equal'},{s:'≡',n:'identical congruent'},{s:'≢',n:'not identical'},
    {s:'≈',n:'approximately equal'},{s:'≉',n:'not approx'},{s:'≃',n:'asymptotically equal'},
    {s:'≅',n:'congruent'},{s:'∼',n:'similar tilde'},{s:'≪',n:'much less than'},{s:'≫',n:'much greater than'},
    {s:'≤',n:'less or equal'},{s:'≥',n:'greater or equal'},{s:'≦',n:'leq'},{s:'≧',n:'geq'},
    {s:'⊂',n:'subset'},{s:'⊃',n:'superset'},{s:'⊆',n:'subset or equal'},{s:'⊇',n:'superset or equal'},
    {s:'∈',n:'element of'},{s:'∉',n:'not element of'},{s:'∋',n:'contains'},{s:'∅',n:'empty set'},
    {s:'∩',n:'intersection'},{s:'∪',n:'union'},{s:'⊓',n:'meet'},{s:'⊔',n:'join'},
    {s:'⊥',n:'perpendicular'},{s:'∥',n:'parallel'},{s:'≺',n:'precedes'},{s:'≻',n:'succeeds'},
    {s:'⊴',n:'normal subgroup'},{s:'⊵',n:'normal supergroup'},
    {s:'∠',n:'angle'},{s:'∡',n:'measured angle'},{s:'∢',n:'spherical angle'},
  ]},
  {id:'arrows', label:'Arrows', syms:[
    {s:'→',n:'right arrow'},{s:'←',n:'left arrow'},{s:'↔',n:'left-right arrow'},
    {s:'⇒',n:'implies right'},{s:'⇐',n:'left implies'},{s:'⇔',n:'iff biconditional'},
    {s:'↦',n:'maps to'},{s:'↪',n:'hookrightarrow injective'},{s:'↠',n:'twoheadrightarrow surjective'},
    {s:'⟶',n:'long right'},{s:'⟵',n:'long left'},{s:'⟷',n:'long lr'},
    {s:'⟹',n:'long implies'},{s:'⟺',n:'long iff'},{s:'⟼',n:'long maps to'},
    {s:'↑',n:'up'},{s:'↓',n:'down'},{s:'↕',n:'up-down'},{s:'⇑',n:'double up'},{s:'⇓',n:'double down'},
    {s:'↗',n:'northeast'},{s:'↘',n:'southeast'},{s:'↙',n:'southwest'},{s:'↖',n:'northwest'},
    {s:'↺',n:'counterclockwise'},{s:'↻',n:'clockwise'},
    {s:'⇌',n:'equilibrium reaction'},{s:'⇀',n:'right harpoon up'},{s:'↽',n:'left harpoon down'},
    {s:'⇁',n:'right harpoon down'},{s:'↼',n:'left harpoon up'},
  ]},
  {id:'greek', label:'Greek', syms:[
    {s:'α',n:'alpha'},{s:'β',n:'beta'},{s:'γ',n:'gamma'},{s:'δ',n:'delta'},{s:'ε',n:'epsilon'},
    {s:'ζ',n:'zeta'},{s:'η',n:'eta'},{s:'θ',n:'theta'},{s:'ι',n:'iota'},{s:'κ',n:'kappa'},
    {s:'λ',n:'lambda'},{s:'μ',n:'mu'},{s:'ν',n:'nu'},{s:'ξ',n:'xi'},{s:'π',n:'pi'},
    {s:'ρ',n:'rho'},{s:'σ',n:'sigma'},{s:'τ',n:'tau'},{s:'υ',n:'upsilon'},{s:'φ',n:'phi'},
    {s:'χ',n:'chi'},{s:'ψ',n:'psi'},{s:'ω',n:'omega'},
    {s:'Α',n:'Alpha'},{s:'Β',n:'Beta'},{s:'Γ',n:'Gamma'},{s:'Δ',n:'Delta'},{s:'Ε',n:'Epsilon'},
    {s:'Ζ',n:'Zeta'},{s:'Η',n:'Eta'},{s:'Θ',n:'Theta'},{s:'Λ',n:'Lambda'},{s:'Ξ',n:'Xi'},
    {s:'Π',n:'Pi'},{s:'Σ',n:'Sigma'},{s:'Υ',n:'Upsilon'},{s:'Φ',n:'Phi'},{s:'Χ',n:'Chi'},
    {s:'Ψ',n:'Psi'},{s:'Ω',n:'Omega'},
    {s:'ϕ',n:'phi variant'},{s:'ϑ',n:'theta variant'},{s:'ϰ',n:'kappa variant'},
    {s:'ϱ',n:'rho variant'},{s:'ϵ',n:'epsilon variant'},{s:'ϖ',n:'pi variant'},
  ]},
  {
    id:'modifiers', label:'Modifiers',
    warn:'⃑ (U+20D1, combining harpoon above) is the standard vector notation. Rendering depends on your font — it works well in most text editors but may look broken in browsers or proportional fonts. Bold vectors (𝐯) and arrow-prefix vectors (→v) are reliable alternatives you can type manually.',
    syms:[
      // Combining harpoon — the one button
      {s:'\u20D1', n:'combining harpoon above (vector) — type letter first, then click', cls:'warn-sym'},
      // Primes
      {s:'′',n:'prime (1st derivative)'},{s:'″',n:'double prime (2nd derivative)'},
      {s:'‴',n:'triple prime (3rd derivative)'},{s:'⁗',n:'quadruple prime'},
      // Fraction-bar character explicitly
      {s:'─',n:'horizontal bar / fraction line (U+2500)'},
      // Fraction slash
      {s:'⁄',n:'fraction slash (for inline ⁿ⁄ₘ style)'},
    ]
  },
  {id:'fracs', label:'Fractions',
   warn:'Multiline fractions are monospace-only — alignment breaks in proportional fonts.',
   fracMode:true,
   syms:[
    {s:'½',n:'1/2'},{s:'⅓',n:'1/3'},{s:'⅔',n:'2/3'},{s:'¼',n:'1/4'},{s:'¾',n:'3/4'},
    {s:'⅕',n:'1/5'},{s:'⅖',n:'2/5'},{s:'⅗',n:'3/5'},{s:'⅘',n:'4/5'},
    {s:'⅙',n:'1/6'},{s:'⅚',n:'5/6'},{s:'⅐',n:'1/7'},{s:'⅛',n:'1/8'},
    {s:'⅜',n:'3/8'},{s:'⅝',n:'5/8'},{s:'⅞',n:'7/8'},{s:'⅑',n:'1/9'},{s:'⅒',n:'1/10'},
  ]},
  {id:'delimiters', label:'Delimiters',
   warn:'Tall bracket pieces (amber) are monospace-only.',
   syms:[
    {s:'(',n:'paren left'},{s:')',n:'paren right'},{s:'[',n:'bracket left'},{s:']',n:'bracket right'},
    {s:'{',n:'brace left'},{s:'}',n:'brace right'},
    {s:'⟨',n:'angle bracket left'},{s:'⟩',n:'angle bracket right'},
    {s:'‖',n:'norm double bar'},{s:'⌊',n:'floor left'},{s:'⌋',n:'floor right'},
    {s:'⌈',n:'ceil left'},{s:'⌉',n:'ceil right'},
    {s:'⎡',n:'square bracket upper left (tall)',cls:'warn-sym'},{s:'⎤',n:'square bracket upper right (tall)',cls:'warn-sym'},
    {s:'⎢',n:'square bracket ext left (tall)',cls:'warn-sym'},{s:'⎥',n:'square bracket ext right (tall)',cls:'warn-sym'},
    {s:'⎣',n:'square bracket lower left (tall)',cls:'warn-sym'},{s:'⎦',n:'square bracket lower right (tall)',cls:'warn-sym'},
    {s:'⎛',n:'paren upper left (tall)',cls:'warn-sym'},{s:'⎞',n:'paren upper right (tall)',cls:'warn-sym'},
    {s:'⎜',n:'paren ext left (tall)',cls:'warn-sym'},{s:'⎟',n:'paren ext right (tall)',cls:'warn-sym'},
    {s:'⎝',n:'paren lower left (tall)',cls:'warn-sym'},{s:'⎠',n:'paren lower right (tall)',cls:'warn-sym'},
    {s:'⎧',n:'curly upper left (tall)',cls:'warn-sym'},{s:'⎫',n:'curly upper right (tall)',cls:'warn-sym'},
    {s:'⎨',n:'curly mid left (tall)',cls:'warn-sym'},{s:'⎬',n:'curly mid right (tall)',cls:'warn-sym'},
    {s:'⎩',n:'curly lower left (tall)',cls:'warn-sym'},{s:'⎭',n:'curly lower right (tall)',cls:'warn-sym'},
    {s:'⎪',n:'curly/bracket extension (tall)',cls:'warn-sym'},
    {s:'[matrix]',n:'open matrix scaffold builder',cls:'snippet',builder:'matrix'},
  ]},
  {id:'bb', label:'𝔸 Fonts', syms:[

// ── State ─────────────────────────────────────────────────────────────────────
let activeCat = CATS[0].id;
const ta = document.getElementById('editor');

// ── Tabs ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'tab' + (c.id === activeCat ? ' active' : '');
    b.textContent = c.label;
    b.onclick = () => { activeCat = c.id; buildTabs(); renderGrid(); };
    bar.appendChild(b);
  });
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function renderGrid(filter = '') {
  const grid = document.getElementById('sym-grid');
  const noteEl = document.getElementById('warn-note');
  const fracBuilder = document.getElementById('frac-builder');
  const matBuilder = document.getElementById('matrix-builder');

  fracBuilder.classList.remove('visible');
  matBuilder.classList.remove('visible');
  noteEl.classList.remove('visible');

  const cat = CATS.find(c => c.id === activeCat);

  let syms = filter
    ? CATS.flatMap(c => c.syms).filter(s => s.n.toLowerCase().includes(filter.toLowerCase()) || s.s.includes(filter))
    : cat.syms;

  if (!filter && cat.warn) {
    noteEl.textContent = cat.warn;
    noteEl.classList.add('visible');
  }
  if (!filter && cat.fracMode) {
    fracBuilder.classList.add('visible');
    updateFracPreview();
  }

  grid.innerHTML = '';
  syms.forEach(({ s, n, cls, builder: bldr }) => {
    const b = document.createElement('button');
    b.className = 'sym' + (cls ? ' ' + cls : '');
    // Special display for the combining harpoon — show it on a sample letter
    b.textContent = (s === '\u20D1') ? 'v\u20D1' : s;
    b.setAttribute('data-name', n);
    b.title = n;
    if (bldr === 'matrix') {
      b.onclick = () => { matBuilder.classList.toggle('visible'); updateMatrixPreview(); };
    } else {
      b.onclick = () => insertAt(s);
    }
    grid.appendChild(b);
  });
}

// ── Insert ────────────────────────────────────────────────────────────────────
function insertAt(text) {
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  ta.focus();
  updateStatus();
}

function filterSyms() {
  renderGrid(document.getElementById('sym-search').value.trim());
}

// ── Fraction builder ──────────────────────────────────────────────────────────
let fracStyle = 'inline';

function updateFracPreview() {
  const num = document.getElementById('frac-num').value || 'a';
  const den = document.getElementById('frac-den').value || 'b';
  const prev = document.getElementById('frac-preview');
  const lbl = document.getElementById('frac-mode-label');

  if (fracStyle === 'inline') {
    const supNum = [...num].map(c => SUP_MAP[c] || c).join('');
    const subDen = [...den].map(c => SUB_MAP[c] || c).join('');
    prev.textContent = supNum + '⁄' + subDen;
    lbl.textContent = 'inline mode';
  } else {
    const w = Math.max(num.length, den.length);
    const bar = '─'.repeat(w);
    const pad = (s) => {
      const left = Math.floor((w - s.length) / 2);
      const right = w - s.length - left;
      return ' '.repeat(left) + s + ' '.repeat(right);
    };
    prev.textContent = pad(num) + '\n' + bar + '\n' + pad(den);
    lbl.textContent = 'multiline — monospace only';
  }
}

function toggleFracStyle() {
  fracStyle = fracStyle === 'inline' ? 'multiline' : 'inline';
  document.getElementById('frac-toggle').textContent =
    fracStyle === 'inline' ? 'Switch to multiline' : 'Switch to inline';
  updateFracPreview();
}

function insertFrac() {
  const num = document.getElementById('frac-num').value || 'a';
  const den = document.getElementById('frac-den').value || 'b';
  if (fracStyle === 'inline') {
    const supNum = [...num].map(c => SUP_MAP[c] || c).join('');
    const subDen = [...den].map(c => SUB_MAP[c] || c).join('');
    insertAt(supNum + '⁄' + subDen);
  } else {
    const w = Math.max(num.length, den.length);
    const bar = '─'.repeat(w);
    const pad = (s) => {
      const left = Math.floor((w - s.length) / 2);
      const right = w - s.length - left;
      return ' '.repeat(left) + s + ' '.repeat(right);
    };
    insertAt(pad(num) + '\n' + bar + '\n' + pad(den));
  }
}

// ── Matrix builder ────────────────────────────────────────────────────────────
function updateMatrixPreview() {}

function insertMatrix() {
  const rows = parseInt(document.getElementById('mat-rows').value) || 2;
  const cols = parseInt(document.getElementById('mat-cols').value) || 2;
  const bracket = document.getElementById('mat-bracket').value;
  const cell = ' · ';
  const rowStr = Array(cols).fill(cell).join(' ');
  const BL = {square:['⎡','⎢','⎣'], round:['⎛','⎜','⎝'], curly:['⎧','⎪','⎩'], none:['','','']};
  const BR = {square:['⎤','⎥','⎦'], round:['⎞','⎟','⎠'], curly:['⎫','⎪','⎭'], none:['','','']};
  const bl = BL[bracket], br = BR[bracket];
  const lines = [];
  for (let r = 0; r < rows; r++) {
    const lc = r === 0 ? bl[0] : r === rows-1 ? bl[2] : bl[1];
    const rc = r === 0 ? br[0] : r === rows-1 ? br[2] : br[1];
    lines.push(lc + rowStr + rc);
  }
  insertAt(lines.join('\n'));
}

// ── Copy / Clear ──────────────────────────────────────────────────────────────
function copyText() {
  navigator.clipboard.writeText(ta.value).then(() => {
    const b = document.getElementById('copy-btn');
    b.textContent = '✓ Copied!';
    b.classList.add('success');
    setTimeout(() => {
      b.innerHTML = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
      b.classList.remove('success');
    }, 1500);
  });
}

function clearText() { ta.value = ''; ta.focus(); updateStatus(); }

function updateStatus() {
  const v = ta.value;
  document.getElementById('char-count').textContent = v.length + ' char' + (v.length !== 1 ? 's' : '');
}

ta.addEventListener('input', updateStatus);

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
ta.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  if (e.key === 'ArrowUp')   { e.preventDefault(); toggleTransform(SUP_MAP, SUP_REV, SUB_REV); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); toggleTransform(SUB_MAP, SUB_REV, SUP_REV); }
  else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); toggleTransform(BOLD_MAP, BOLD_REV, null); }
  else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); toggleTransform(ITALIC_MAP, ITALIC_REV, null); }
});

function toggleTransform(fwdMap, revMap, altRevMap) {
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end);
  if (!sel) return;
  const chars = [...sel];
  const allTransformed = chars.every(c => c === ' ' || c === '\n' || revMap[c] !== undefined || (altRevMap && altRevMap[c] !== undefined));
  const out = allTransformed
    ? chars.map(c => revMap[c] || (altRevMap && altRevMap[c]) || c).join('')
    : chars.map(c => fwdMap[c] || fwdMap[c.toLowerCase()] || c).join('');
  ta.value = ta.value.slice(0, start) + out + ta.value.slice(end);
  ta.selectionStart = start;
  ta.selectionEnd = start + out.length;
  updateStatus();
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildTabs();
renderGrid();
